<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Audit Logs</title>

  <link rel="shortcut icon" href="../assets/images/logo/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="admin-page">
  <div class="admin-shell">
    <aside class="admin-sidebar" aria-label="System admin navigation">
      <a class="admin-brand" href="dashboard.html">
        <img src="../assets/images/logo/icon.png" alt="InternGuide">
        <div>
          <span>InternGuide</span>
          <small>System Admin</small>
        </div>
      </a>

      <nav class="admin-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="universities.html">Universities</a>
        <a href="recruiter-verifications.html">Verifications</a>
        <a href="internships.html">Internships</a>
        <a href="applications.html">Applications</a>
        <a href="users.html">Users</a>
        <a class="active" href="audit-logs.html">Audit Logs</a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="../index.html">Public site</a>
        <a href="#" id="admin-logout-link">Logout</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div>
          <span class="admin-kicker">System Admin</span>
          <h1>Audit Logs</h1>
        </div>
        <a class="admin-home-link" href="../index.html">Public site</a>
      </header>

      <div class="admin-content">
        <div id="admin-audit-message" class="admin-message" role="alert"></div>

        <section class="admin-panel">
          <div class="admin-panel-header">
            <h2>Activity history</h2>
          </div>
          <form id="admin-audit-filter-form" class="admin-filter-form">
            <div class="admin-field">
              <label for="audit-actor-role">Actor role</label>
              <input id="audit-actor-role" name="actor_role" type="text" class="admin-input" placeholder="system_admin">
            </div>
            <div class="admin-field">
              <label for="audit-action">Action</label>
              <input id="audit-action" name="action" type="text" class="admin-input" placeholder="Action">
            </div>
            <div class="admin-field">
              <label for="audit-entity-type">Entity type</label>
              <input id="audit-entity-type" name="entity_type" type="text" class="admin-input" placeholder="Entity type">
            </div>
            <button type="submit" class="admin-button">Filter</button>
          </form>

          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Created</th>
                  <th>Actor</th>
                  <th>Action</th>
                  <th>Entity</th>
                  <th>Metadata</th>
                </tr>
              </thead>
              <tbody id="admin-audit-table">
                <tr><td colspan="5">Loading audit logs...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/admin/admin-api.js"></script>
  <script src="../assets/js/admin/admin-audit-logs.js"></script>
</body>

</html>
