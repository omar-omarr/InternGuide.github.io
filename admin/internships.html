<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Moderate Internships</title>

  <link rel="shortcut icon" href="../assets/images/logo/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="admin-page">
  <div class="admin-shell">
    <aside class="admin-sidebar" aria-label="System admin navigation">
      <a class="admin-brand" href="dashboard.html">
        <img src="../assets/images/logo/icon.png" alt="InternGuide">
        <div>
          <span>InternGuide</span>
          <small>System Admin</small>
        </div>
      </a>

      <nav class="admin-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="universities.html">Universities</a>
        <a href="recruiter-verifications.html">Verifications</a>
        <a class="active" href="internships.html">Internships</a>
        <a href="applications.html">Applications</a>
        <a href="users.html">Users</a>
        <a href="audit-logs.html">Audit Logs</a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="../index.html">Public site</a>
        <a href="#" id="admin-logout-link">Logout</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div>
          <span class="admin-kicker">System Admin</span>
          <h1>Internships</h1>
        </div>
        <a class="admin-home-link" href="../index.html">Public site</a>
      </header>

      <div class="admin-content">
        <div id="admin-internships-message" class="admin-message" role="alert"></div>

        <section class="admin-panel">
          <div class="admin-panel-header">
            <h2>Internship moderation</h2>
          </div>
          <form id="admin-internship-filter-form" class="admin-filter-form">
            <div class="admin-field">
              <label for="internship-search">Search</label>
              <input id="internship-search" name="q" type="search" class="admin-input" placeholder="Title, company, or location">
            </div>
            <div class="admin-field admin-field-small">
              <label for="internship-status">Status</label>
              <select id="internship-status" name="status" class="admin-input">
                <option value="">all</option>
                <option value="active">active</option>
                <option value="closed">closed</option>
              </select>
            </div>
            <div class="admin-field admin-field-small">
              <label for="internship-approval-status">Approval</label>
              <select id="internship-approval-status" name="approval_status" class="admin-input">
                <option value="">all</option>
                <option value="pending">pending</option>
                <option value="approved">approved</option>
                <option value="rejected">rejected</option>
              </select>
            </div>
            <button type="submit" class="admin-button">Search</button>
          </form>

          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Company</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th>Approval</th>
                  <th>Applications</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="admin-internships-table">
                <tr><td colspan="7">Loading internships...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/admin/admin-api.js"></script>
  <script src="../assets/js/admin/admin-internships.js"></script>
</body>

</html>
