<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Recruiter Verifications</title>

  <link rel="shortcut icon" href="../assets/images/logo/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="admin-page">
  <div class="admin-shell">
    <aside class="admin-sidebar" aria-label="System admin navigation">
      <a class="admin-brand" href="dashboard.html">
        <img src="../assets/images/logo/icon.png" alt="InternGuide">
        <div>
          <span>InternGuide</span>
          <small>System Admin</small>
        </div>
      </a>

      <nav class="admin-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="universities.html">Universities</a>
        <a class="active" href="recruiter-verifications.html">Verifications</a>
        <a href="internships.html">Internships</a>
        <a href="users.html">Users</a>
        <a href="audit-logs.html">Audit Logs</a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="../index.html">Public site</a>
        <a href="#" id="admin-logout-link">Logout</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div>
          <span class="admin-kicker">System Admin</span>
          <h1>Recruiter Verifications</h1>
        </div>
        <a class="admin-home-link" href="../index.html">Public site</a>
      </header>

      <div class="admin-content">
        <div id="admin-verifications-message" class="admin-message" role="alert"></div>

        <section class="admin-panel">
          <div class="admin-panel-header">
            <h2>Verification queue</h2>
            <form id="admin-verification-filter-form" class="admin-filter-form">
              <div class="admin-field">
                <label for="verification-status">Status</label>
                <select id="verification-status" name="status" class="admin-input">
                  <option value="pending">pending</option>
                  <option value="approved">approved</option>
                  <option value="rejected">rejected</option>
                  <option value="">all</option>
                </select>
              </div>
              <button type="submit" class="admin-button">Load</button>
            </form>
          </div>

          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Company</th>
                  <th>Recruiter</th>
                  <th>Email</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="admin-verifications-table">
                <tr><td colspan="6">Loading verifications...</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="admin-panel">
          <h2>Verification details</h2>
          <div id="admin-verification-detail" class="admin-detail-box">Select a verification.</div>
          <form id="admin-verification-review-form">
            <input type="hidden" name="id">
            <div class="admin-form-grid">
              <div class="admin-field admin-field-small">
                <label for="review-status">Decision</label>
                <select id="review-status" name="status" class="admin-input">
                  <option value="approved">approved</option>
                  <option value="rejected">rejected</option>
                </select>
              </div>
              <div class="admin-field">
                <label for="review-reason">Rejection reason</label>
                <input id="review-reason" name="rejection_reason" type="text" class="admin-input">
              </div>
            </div>
            <div class="admin-form-actions">
              <button type="submit" class="admin-button">Review</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/admin/admin-api.js"></script>
  <script src="../assets/js/admin/admin-recruiter-verifications.js"></script>
</body>

</html>
