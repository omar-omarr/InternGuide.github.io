services:
  - type: web
    name: internguide-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    preDeployCommand: npm run db:init && npm run migrate:portal-upgrade && npm run migrate:bau-career-center
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: internguide-db
          property: connectionString
      - key: PGSSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://omar-omarr.github.io
      - key: UPLOAD_DIR
        value: /var/data/resumes
      - key: REPORT_UPLOAD_DIR
        value: /var/data/reports
    disk:
      name: internguide-resumes
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: internguide-db
    databaseName: internguide
    user: internguide
