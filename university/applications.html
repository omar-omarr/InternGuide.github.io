<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>University Applications</title>

  <link rel="shortcut icon" href="../assets/images/logo/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="admin-page">
  <div class="admin-shell">
    <aside class="admin-sidebar" aria-label="University admin navigation">
      <a class="admin-brand" href="dashboard.html">
        <img src="../assets/images/logo/icon.png" alt="InternGuide">
        <div><span>InternGuide</span><small>University Admin</small></div>
      </a>
      <nav class="admin-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="internship-approvals.html">Approvals</a>
        <a class="active" href="applications.html">Applications</a>
        <a href="notifications.html">Notifications</a>
        <a href="audit-logs.html">Audit Logs</a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../index.html">Public site</a>
        <a href="#" id="university-logout-link">Logout</a>
      </div>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <div><span class="admin-kicker">University Admin</span><h1>Applications</h1></div>
        <a class="admin-home-link" href="../index.html">Public site</a>
      </header>
      <div class="admin-content">
        <div id="university-applications-message" class="admin-message" role="alert"></div>
        <section class="admin-panel">
          <div class="admin-panel-header"><h2>Related applications</h2></div>
          <form id="university-application-filter-form" class="admin-filter-form">
            <div class="admin-field">
              <label for="application-search">Search</label>
              <input id="application-search" name="q" type="search" class="admin-input" placeholder="Student, title, company">
            </div>
            <div class="admin-field">
              <label for="application-status">Status</label>
              <select id="application-status" name="status" class="admin-input">
                <option value="">all</option>
                <option value="submitted">submitted</option>
                <option value="viewed">viewed</option>
                <option value="shortlisted">shortlisted</option>
                <option value="interview_scheduled">interview scheduled</option>
                <option value="rejected">rejected</option>
                <option value="accepted">accepted</option>
                <option value="withdrawn">withdrawn</option>
              </select>
            </div>
            <button type="submit" class="admin-button">Load</button>
          </form>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Email</th>
                  <th>Internship</th>
                  <th>Company</th>
                  <th>Status</th>
                  <th>Verification</th>
                  <th>Created</th>
                </tr>
              </thead>
              <tbody id="university-applications-table">
                <tr><td colspan="7">Loading applications...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/university/university-api.js"></script>
  <script src="../assets/js/university/university-applications.js"></script>
</body>

</html>
