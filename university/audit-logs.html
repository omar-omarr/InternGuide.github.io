<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>University Audit Logs</title>

  <link rel="shortcut icon" href="../assets/images/logo/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="admin-page">
  <div class="admin-shell">
    <aside class="admin-sidebar" aria-label="University admin navigation">
      <a class="admin-brand" href="dashboard.html">
        <img src="../assets/images/logo/icon.png" alt="InternGuide">
        <div><span>InternGuide</span><small>University Admin</small></div>
      </a>
      <nav class="admin-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="internship-approvals.html">Approvals</a>
        <a href="applications.html">Applications</a>
        <a href="notifications.html">Notifications</a>
        <a class="active" href="audit-logs.html">Audit Logs</a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../index.html">Public site</a>
        <a href="#" id="university-logout-link">Logout</a>
      </div>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <div><span class="admin-kicker">University Admin</span><h1>Audit Logs</h1></div>
        <a class="admin-home-link" href="../index.html">Public site</a>
      </header>
      <div class="admin-content">
        <div id="university-audit-message" class="admin-message" role="alert"></div>
        <section class="admin-panel">
          <div class="admin-panel-header"><h2>University activity</h2></div>
          <form id="university-audit-filter-form" class="admin-filter-form">
            <div class="admin-field">
              <label for="audit-action">Action</label>
              <input id="audit-action" name="action" type="text" class="admin-input" placeholder="Action">
            </div>
            <button type="submit" class="admin-button">Filter</button>
          </form>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Created</th>
                  <th>Actor</th>
                  <th>Action</th>
                  <th>Entity</th>
                  <th>Metadata</th>
                </tr>
              </thead>
              <tbody id="university-audit-table">
                <tr><td colspan="5">Loading audit logs...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/university/university-api.js"></script>
  <script src="../assets/js/university/university-audit-logs.js"></script>
</body>

</html>
