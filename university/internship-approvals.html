<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>University Internship Approvals</title>

  <link rel="shortcut icon" href="../assets/images/logo/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="admin-page">
  <div class="admin-shell">
    <aside class="admin-sidebar" aria-label="University admin navigation">
      <a class="admin-brand" href="dashboard.html">
        <img src="../assets/images/logo/icon.png" alt="InternGuide">
        <div><span>InternGuide</span><small>University Admin</small></div>
      </a>
      <nav class="admin-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a class="active" href="internship-approvals.html">Approvals</a>
        <a href="applications.html">Applications</a>
        <a href="notifications.html">Notifications</a>
        <a href="audit-logs.html">Audit Logs</a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../index.html">Public site</a>
        <a href="#" id="university-logout-link">Logout</a>
      </div>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <div><span class="admin-kicker">University Admin</span><h1>Internship Approvals</h1></div>
        <a class="admin-home-link" href="../index.html">Public site</a>
      </header>
      <div class="admin-content">
        <div id="university-approvals-message" class="admin-message" role="alert"></div>
        <section class="admin-panel">
          <div class="admin-panel-header"><h2>Approval queue</h2></div>
          <form id="university-approval-filter-form" class="admin-filter-form">
            <div class="admin-field">
              <label for="approval-search">Search</label>
              <input id="approval-search" name="q" type="search" class="admin-input" placeholder="Title, company, department">
            </div>
            <div class="admin-field">
              <label for="approval-status">Status</label>
              <select id="approval-status" name="status" class="admin-input">
                <option value="pending">pending</option>
                <option value="approved">approved</option>
                <option value="rejected">rejected</option>
                <option value="">all</option>
              </select>
            </div>
            <button type="submit" class="admin-button">Load</button>
          </form>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Internship</th>
                  <th>Company</th>
                  <th>Department</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="university-approvals-table">
                <tr><td colspan="6">Loading approvals...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
        <section class="admin-panel">
          <h2>Review approval</h2>
          <div id="university-approval-detail" class="admin-detail-box">Select an approval.</div>
          <form id="university-approval-review-form">
            <input type="hidden" name="id">
            <div class="admin-form-grid">
              <div class="admin-field">
                <label for="approval-review-status">Decision</label>
                <select id="approval-review-status" name="status" class="admin-input">
                  <option value="approved">approved</option>
                  <option value="rejected">rejected</option>
                </select>
              </div>
              <div class="admin-field">
                <label for="approval-notes">Notes</label>
                <input id="approval-notes" name="notes" type="text" class="admin-input">
              </div>
            </div>
            <div class="admin-form-actions">
              <button type="submit" class="admin-button">Submit Review</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/university/university-api.js"></script>
  <script src="../assets/js/university/university-internship-approvals.js"></script>
</body>

</html>
